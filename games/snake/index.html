<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="https://img.icons8.com/color/48/000000/snake.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/96/000000/snake.png">
    <meta name="theme-color" content="#2196f3">
    <title>Snake Game</title>
    <style>
        :root { --card-max: 520px; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: 'Roboto', sans-serif;
        }
        .container { width: 100%; display: flex; justify-content: center; }
        .card {
            width: min(95vw, var(--card-max));
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 16px 16px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 { color: #2196f3; margin: 8px 0 12px; font-size: 28px; }
        #snake-canvas {
            background: #e0f7fa; border: 2px solid #333; border-radius: 10px; display: block; margin: 0 auto;
            touch-action: none; user-select: none;
            max-width: 100%; max-height: calc(100dvh - 260px);
        }
        .hint { color: #555; font-size: 14px; margin-top: 10px; }
        .actions { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button, .back-button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        button { background: #4caf50; color: #fff; }
        button:hover { background: #43a047; }
        .back-button { background: #2196f3; color: #fff; text-decoration: none; display: inline-block; }
        .back-button:hover { background: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" ontouchstart="" style="touch-action:manipulation;">
            <h1>Snake Game</h1>
            <canvas id="snake-canvas" width="400" height="400"></canvas>
            <div class="hint">Desktop: phím mũi tên để di chuyển, Space để bắt đầu, P tạm dừng. Mobile: vuốt để điều khiển.</div>
            <div class="actions">
                <button onclick="startSnakeGame()">Chơi ngay</button>
                <a href="../../index.html" class="back-button">Back to Hub</a>
            </div>
        </div>
    </div>
    <script src="snake.js"></script>
</body>
</html>
