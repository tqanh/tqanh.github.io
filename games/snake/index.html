<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" href="https://img.icons8.com/color/48/000000/snake.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/96/000000/snake.png">
    <meta name="theme-color" content="#2196f3">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* dynamic viewport height on mobile */
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: 'Roboto', sans-serif;
        }
        .coming-soon { text-align: center; padding: 16px; width: 100%; box-sizing: border-box; }
        h1 { color: #2196f3; margin-bottom: 10px; }
        #snake-canvas { 
            background: #e0f7fa; border: 2px solid #333; display: block; margin: 0 auto; 
            touch-action: none; user-select: none; 
            max-width: 95vw; max-height: calc(100dvh - 180px); /* prevent overflow even if JS fails */
        }
        .hint { color: #555; font-size: 14px; margin-top: 10px; }
        .back-button { padding: 10px 20px; background: #2196f3; color: white; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
        .back-button:hover { background: #1976d2; }
    </style>
</head>
<body>
    <div class="coming-soon" ontouchstart="" style="touch-action:manipulation;">
        <h1>Snake Game</h1>
        <div style="text-align:center;margin:20px 0;">
            <canvas id="snake-canvas" width="400" height="400"></canvas>
            <div class="hint">Desktop: phím mũi tên để di chuyển, Space để bắt đầu, P tạm dừng. Mobile: vuốt để điều khiển.</div>
            <br>
            <button onclick="startSnakeGame()">Chơi ngay</button>
        </div>
        <a href="../../index.html" class="back-button">Back to Hub</a>
    </div>
    <script src="snake.js"></script>
</body>
</html>
