<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="TqAnh Portal - Tập hợp các ứng dụng và trò chơi">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/egg.svg">
    <title>TqAnh Portal</title>
    <link rel="stylesheet" href="styles/portal.css">
</head>
<body>
    <header class="portal-header">
        <h1>🚀 TqAnh Portal</h1>
        <p>Khám phá các tính năng và ứng dụng thú vị</p>
    </header>

    <main class="features-grid">
        <a href="./features/games/" class="feature-card">
            <div class="feature-icon">🎮</div>
            <h2>Game Hub</h2>
            <p>Bộ sưu tập game đa nền tảng: Bắn Trứng, Rắn Săn Mồi, Thẻ Ghi Nhớ.</p>
            <span class="feature-badge">Hot</span>
        </a>

        <div class="feature-card coming-soon">
            <div class="feature-icon">📝</div>
            <h2>Ghi Chú</h2>
            <p>Ứng dụng ghi chú cá nhân với đồng bộ cloud.</p>
            <span class="feature-badge beta">Sắp ra mắt</span>
        </div>

        <div class="feature-card coming-soon">
            <div class="feature-icon">🎨</div>
            <h2>Canvas Draw</h2>
            <p>Vẽ và thiết kế trực tuyến.</p>
            <span class="feature-badge beta">Sắp ra mắt</span>
        </div>
    </main>

    <div class="version" id="version">v3.0.0</div>

    <script src="js/portal.js"></script>
</body>
</html>
